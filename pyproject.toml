# Configuration des outils uniquement (le projet n'est pas packagé).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["queuesmart"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W : style PEP 8 · F : erreurs (imports inutilisés…) · I : imports triés
# N : conventions de nommage · UP : syntaxe Python moderne
# B : bugs fréquents · SIM : simplifications possibles
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]
