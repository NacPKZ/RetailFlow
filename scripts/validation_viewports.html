<!doctype html><html lang="fr"><meta charset="utf-8"><title>Validation des formats RetailFlow</title>
<style>body{margin:0;background:#dde7ed;font:16px system-ui;color:#19344d}header{padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{font:inherit;padding:10px;border:1px solid #9bb1bf;background:white;border-radius:6px}#wrapper{margin:auto;position:relative;background:white}iframe{border:0;position:absolute;top:0;left:0;transform-origin:top left}output{font-weight:600}</style>
<header><strong>Viewport CSS réel</strong><button>1920 x 1080</button><button>1366 x 768</button><button>1024 x 768</button><button>768 x 1024</button><button>390 x 844</button><output></output></header>
<div id="wrapper"><iframe src="/" title="Application RetailFlow en test"></iframe></div>
<script>const f=document.querySelector('iframe'),w=document.querySelector('#wrapper'),out=document.querySelector('output');let dimensions=[1366,768];function size(){const [width,height]=dimensions,scale=Math.min(1,(innerWidth-24)/width,(innerHeight-80)/height);f.style.width=width+'px';f.style.height=height+'px';f.style.transform='scale('+scale+')';w.style.width=width*scale+'px';w.style.height=height*scale+'px';out.textContent=width+' x '+height+' (échelle visuelle '+Math.round(scale*100)+' %)';}document.querySelectorAll('button').forEach(b=>b.onclick=()=>{dimensions=b.textContent.split(' x ').map(Number);size();});window.addEventListener('resize',size);size();</script></html>
